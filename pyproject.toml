[project]
name = "ogma-jupyter"
version = "0.1.0"
description = "Interactive Ogma graph visualization for Jupyter notebooks"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Linkurious", email = "support@linkurious.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10"
dependencies = [
    "anywidget>=0.9.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "jupyterlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/Linkurious/ogma-jupyter"
Documentation = "https://doc.linkurious.com/ogma-jupyter/latest/"
Repository = "https://github.com/Linkurious/ogma-jupyter"

[build-system]
requires = ["hatchling>=1.28", "hatch-jupyter-builder>=0.9"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ogma_jupyter"]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["src/ogma_jupyter/static/widget.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = "npm"
build_cmd = "build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
