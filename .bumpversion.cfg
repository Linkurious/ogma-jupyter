[bumpversion]
current_version = 0.2.0
commit = False
tag = False
serialize =
	{major}.{minor}.{patch}-{build}
	{major}.{minor}.{patch}
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(-(?P<build>[\w_-]+\.\d+))?

[bumpversion:file:.version]
[bumpversion:file:package.json]
[bumpversion:file:package-lock.json]
# pyproject.toml and src/ogma_jupyter/_version.py are NOT listed on purpose:
# CI bumps to pre-release builds like 0.2.0-PR-49.1, which is not a valid
# PEP 440 version, so uv/pip would refuse to build the package. Bump those two
# by hand to the plain release version (e.g. 0.2.0) when cutting a release.
